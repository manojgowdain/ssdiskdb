name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run performance benchmarks
        required: false
        default: false
        type: boolean
      run_large_tests:
        description: Run large concurrency tests (500 workers)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      node: ${{ steps.meta.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate package metadata
        run: node --test tests/package-metadata.test.js
      - name: Record toolchain
        id: meta
        run: echo "node=$(node -v)" >> "$GITHUB_OUTPUT"

  core-tests:
    name: Core tests (Node ${{ matrix.node-version }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/core.test.js tests/runtime-entrypoints.test.js

  ttl-tests:
    name: TTL tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/ttl.test.js

  hash-tests:
    name: Hash tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/hash.test.js

  sorted-set-tests:
    name: Sorted set tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/sorted-set.test.js

  batch-tests:
    name: Batch tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/batch.test.js

  scan-tests:
    name: Scan tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/scan.test.js

  cache-tests:
    name: Cache tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/cache.test.js

  namespace-tests:
    name: Namespace tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/namespace.test.js

  auth-tests:
    name: Authentication tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/auth.test.js

  rbac-tests:
    name: RBAC tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test --test-name-pattern "Role-Based Access Control" test.js

  encryption-tests:
    name: Encryption tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/encryption.test.js
      - run: node --test --test-name-pattern "encrypted records reject ciphertext tampering" test-upgrade.js
      - run: node --test --test-name-pattern "Encryption in local mode" test.js

  grpc-tests:
    name: gRPC tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/grpc.test.js
      - run: node --test --test-name-pattern "gRPC reuses a channel" test-upgrade.js

  tls-tests:
    name: TLS tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: openssl version
      - run: node --test --test-name-pattern "gRPC TLS" test-upgrade.js

  concurrency-tests:
    name: Concurrency tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSDISKDB_LARGE_TESTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_large_tests == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/concurrency.test.js

  crash-restart-tests:
    name: Crash / restart tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/crash-restart.test.js

  cli-tests:
    name: CLI tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/cli.test.js
      - run: node dist/cjs/cli.js --help

  integration-tests:
    name: Integration / dashboard tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test.js test-upgrade.js

  package-tests:
    name: npm package tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
        env:
          npm_config_fund: "false"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-package-debug
          path: "*.tgz"
          if-no-files-found: ignore

  deno-tests:
    name: Deno tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deno: ${{ steps.meta.outputs.deno }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno --version
      - run: deno fmt --check deno.json jsr.json mod.ts tests/deno_test.ts
      - run: deno lint mod.ts tests/deno_test.ts
      - run: deno check mod.ts
      - run: deno test --allow-env tests/deno_test.ts
      - id: meta
        run: echo "deno=$(deno --version | head -n 1)" >> "$GITHUB_OUTPUT"

  jsr:
    name: JSR validation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publication: ${{ steps.remote.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Local JSR compatibility
        run: deno publish --dry-run --allow-dirty
      - name: Published JSR package
        id: remote
        continue-on-error: true
        run: |
          if deno check 'jsr:@manojgowdain/ssdiskdb@0.1.0'; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=NOT VERIFIED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  documentation:
    name: Documentation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node --test tests/docs-site.test.js
      - name: Static documentation files
        run: |
          test -f index.html
          test -f readme.md
          if [ -d website/.vitepress ]; then
            echo "VitePress site is present; a docs build script is required"
            exit 1
          fi
          echo "Documentation build: NOT APPLICABLE (static index.html; no VitePress/docs build script)"
          echo "/aiagents: NOT APPLICABLE (route not present in this commit)"

  coverage:
    name: Coverage (informational)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Node test coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=spec tests/core.test.js tests/ttl.test.js tests/hash.test.js tests/batch.test.js tests/scan.test.js tests/cache.test.js | tee coverage/node-coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  benchmarks:
    name: Benchmarks
    needs: quality
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_benchmarks == 'true' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run benchmark scripts
        run: |
          mkdir -p benchmark-results
          node benchmark/local.cjs 1000 | tee benchmark-results/local.jsonl
          node benchmark/grpc.cjs 200 | tee benchmark-results/grpc.jsonl
          node benchmark/encryption.cjs 20 | tee benchmark-results/encryption.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: ignore

  summary:
    name: Summary
    if: always()
    needs:
      - quality
      - core-tests
      - ttl-tests
      - hash-tests
      - sorted-set-tests
      - batch-tests
      - scan-tests
      - cache-tests
      - namespace-tests
      - auth-tests
      - rbac-tests
      - encryption-tests
      - grpc-tests
      - tls-tests
      - concurrency-tests
      - crash-restart-tests
      - cli-tests
      - integration-tests
      - package-tests
      - deno-tests
      - jsr
      - documentation
      - coverage
      - benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write CI report
        env:
          QUALITY: ${{ needs.quality.result }}
          CORE: ${{ needs.core-tests.result }}
          TTL: ${{ needs.ttl-tests.result }}
          HASH: ${{ needs.hash-tests.result }}
          ZSET: ${{ needs.sorted-set-tests.result }}
          BATCH: ${{ needs.batch-tests.result }}
          SCAN: ${{ needs.scan-tests.result }}
          CACHE: ${{ needs.cache-tests.result }}
          NS: ${{ needs.namespace-tests.result }}
          AUTH: ${{ needs.auth-tests.result }}
          RBAC: ${{ needs.rbac-tests.result }}
          ENC: ${{ needs.encryption-tests.result }}
          GRPC: ${{ needs.grpc-tests.result }}
          TLS: ${{ needs.tls-tests.result }}
          CONC: ${{ needs.concurrency-tests.result }}
          CRASH: ${{ needs.crash-restart-tests.result }}
          CLI: ${{ needs.cli-tests.result }}
          INTEG: ${{ needs.integration-tests.result }}
          PKG: ${{ needs.package-tests.result }}
          DENO: ${{ needs.deno-tests.result }}
          JSR: ${{ needs.jsr.result }}
          JSR_PUB: ${{ needs.jsr.outputs.publication }}
          DOCS: ${{ needs.documentation.result }}
          COV: ${{ needs.coverage.result }}
          BENCH: ${{ needs.benchmarks.result }}
          NODE: ${{ needs.quality.outputs.node }}
          DENO_VER: ${{ needs.deno-tests.outputs.deno }}
        run: |
          python3 - <<'PY'
          import os
          def status(value, *, optional=False, na=None):
              if na:
                  return na
              mapping = {
                  "success": "PASS",
                  "failure": "FAIL",
                  "cancelled": "CANCELLED",
                  "skipped": "SKIPPED",
              }
              label = mapping.get(value, value or "UNKNOWN")
              if optional and value == "skipped":
                  return "SKIPPED"
              return label

          jsr_pub = os.environ.get("JSR_PUB") or ""
          jsr_job = os.environ.get("JSR")
          if jsr_job == "success" and jsr_pub == "PASS":
              jsr_line = "PASS"
          elif jsr_job == "success":
              jsr_line = "local PASS; publication NOT VERIFIED"
          elif jsr_job == "failure":
              jsr_line = "FAIL"
          else:
              jsr_line = status(jsr_job)

          rows = [
              ("Quality", status(os.environ["QUALITY"])),
              ("Core", status(os.environ["CORE"])),
              ("TTL", status(os.environ["TTL"])),
              ("Hash", status(os.environ["HASH"])),
              ("Sorted Set", status(os.environ["ZSET"])),
              ("Batch", status(os.environ["BATCH"])),
              ("Scan", status(os.environ["SCAN"])),
              ("Cache", status(os.environ["CACHE"])),
              ("Namespaces", status(os.environ["NS"])),
              ("Authentication", status(os.environ["AUTH"])),
              ("RBAC", status(os.environ["RBAC"])),
              ("Encryption", status(os.environ["ENC"])),
              ("gRPC", status(os.environ["GRPC"])),
              ("TLS", status(os.environ["TLS"])),
              ("Concurrency", status(os.environ["CONC"])),
              ("Crash/Restart", status(os.environ["CRASH"])),
              ("CLI", status(os.environ["CLI"])),
              ("Integration", status(os.environ["INTEG"])),
              ("npm package", status(os.environ["PKG"])),
              ("Deno", status(os.environ["DENO"])),
              ("JSR", jsr_line),
              ("Documentation", status(os.environ["DOCS"])),
              ("Coverage", status(os.environ["COV"], optional=True) + " (informational)"),
              ("Benchmarks", status(os.environ["BENCH"], optional=True)),
          ]
          failed = [name for name, result in rows if result.startswith("FAIL") or result == "CANCELLED"]
          skipped = [name for name, result in rows if "SKIPPED" in result]
          required_fail = os.environ["QUALITY"] != "success"
          for key in ["CORE","TTL","HASH","ZSET","BATCH","SCAN","CACHE","NS","AUTH","RBAC","ENC","GRPC","TLS","CONC","CRASH","CLI","INTEG","PKG","DENO","JSR","DOCS"]:
              if os.environ.get(key) not in ("success", "skipped"):
                  required_fail = True
          text = [
              "# SSDiskDB CI Report",
              "",
              "Package:",
              "`@manojgowdain/ssdiskdb`",
              "",
              "Commit:",
              f"`{os.environ.get('GITHUB_SHA', '')}`",
              "",
              "Node:",
              os.environ.get("NODE") or "not reported",
              "",
              "Deno:",
              os.environ.get("DENO_VER") or "not reported",
              "",
          ]
          for name, result in rows:
              text.append(f"{name}:")
              text.append(result)
              text.append("")
          text += [
              "Total:",
              str(len(rows)),
              "",
              "Failed:",
              str(len(failed)) + ((" (" + ", ".join(failed) + ")") if failed else ""),
              "",
              "Skipped:",
              str(len(skipped)) + ((" (" + ", ".join(skipped) + ")") if skipped else ""),
              "",
              "Coverage:",
              "NOT CONFIGURED as a required gate; Node experimental coverage is informational only.",
              "",
              "/aiagents documentation:",
              "NOT APPLICABLE in this commit",
          ]
          path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(path, "w", encoding="utf8") as fh:
              fh.write("\n".join(text) + "\n")
          if required_fail:
              raise SystemExit(1)
          PY
